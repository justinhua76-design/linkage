[project]
name = "bioage-backend"
version = "0.1.0"
description = "uSciTec BioAge AI - deterministic biological age engine (research use only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.54",
    "alembic==1.14.1",
    "psycopg[binary]==3.2.13",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.17.0", "mypy==2.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: requires a running PostgreSQL (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
